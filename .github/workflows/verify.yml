name: Verify application and isolated demo

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - run: npm run check:demo
