name: Verify and deploy demo

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - run: npm run check:demo
      - run: npm run build:pages
      - run: npm run check:demo -- /worklog-for-redmine/
      - name: Upload verified demo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'cristianworth/worklog-for-redmine'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'cristianworth/worklog-for-redmine'
    needs: [verify, launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy verified demo
        id: deployment
        uses: actions/deploy-pages@v5

  launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run launcher:build
      - run: npm run launcher:check
